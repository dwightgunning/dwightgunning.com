name: Continuous Integration

on:
  push:
    branches:
      - '**'
      - '!staging'
      - '!production'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Login to GHCR
        if: ${{ env.ACT }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Yarn when running via act
        if: ${{ env.ACT }}
        run: npm install -g yarn

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint the Astro project
        run: yarn astro check

      - name: Audit with TruffleHog
        uses: trufflesecurity/trufflehog@v3.95.3
        with:
          path: ./
          extra_args: --exclude-paths=.trufflehog-exclude-paths
